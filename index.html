<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบรับสมัครงาน (RBAC & Authentication)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F5EE; --paper-2:#F1EBDD; --ink:#20302B; --ink-soft:#54655D;
    --line:#D8CFB8; --line-strong:#20302B; --forest:#2F5D50; --forest-dark:#1B3B32;
    --rust:#8C4A38; --white:#FFFEFB; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.6;}
  .wrap{max-width:820px; margin:0 auto; padding:2.5rem 1.5rem 5rem;}

  /* User Status Header Bar */
  .user-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--paper-2); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 8px; margin-bottom: 15px; font-size: 14px;
  }
  .role-badge { padding: 3px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }
  .role-Admin { background: #e74c3c; color: #fff; }
  .role-Auditor { background: #e67e22; color: #fff; }
  .role-Staff { background: #27ae60; color: #fff; }

  /* Login Overlay */
  .login-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(32,48,43,0.85); z-index: 3000;
    display: flex; justify-content: center; align-items: center; padding: 20px;
  }
  .login-box {
    background: var(--white); padding: 2.5rem; border-radius: var(--radius);
    max-width: 420px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
  }

  nav.tabs{ display:flex; gap:4px; margin:2rem 0 0; border-bottom:2px solid var(--line-strong); }
  nav.tabs button{
    font-family:'Fraunces',serif; font-size:15px; font-weight:600;
    background:var(--paper-2); border:1px solid var(--line); border-bottom:none;
    color:var(--ink-soft); padding:10px 20px 12px; border-radius:8px 8px 0 0; cursor:pointer;
  }
  nav.tabs button.active{ background:var(--white); color:var(--ink); border-color:var(--line-strong); border-bottom:2px solid var(--white); }

  .panel{ background:var(--white); border:1px solid var(--line-strong); border-top:none; border-radius:0 0 var(--radius) var(--radius); padding:2rem; }
  .section-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--forest); border-bottom:1px dashed var(--line); padding-bottom:6px; margin:2rem 0 1rem; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:560px){ .grid2{grid-template-columns:1fr;} }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:500; color:var(--ink); margin-bottom:6px; }
  input[type=text], input[type=tel], input[type=email], input[type=password], input[type=date], select, textarea{
    width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink);
  }
  textarea{ min-height:80px; }

  button.primary{ font-weight:600; font-size:14px; background:var(--forest); color:var(--white); border:none; padding:12px 24px; border-radius:8px; cursor:pointer; }
  button.primary:hover{ background:var(--forest-dark); }

  .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background: #e0d8c3; color: #333; }

  /* Modal Details */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(32,48,43,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal-content { background: var(--white); width: 100%; max-width: 650px; border-radius: var(--radius); padding: 2rem; max-height: 90vh; overflow-y: auto; position: relative; }
  .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer; }
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2 style="margin-top:0; font-family:'Fraunces',serif; color:var(--ink);">เข้าสู่ระบบ</h2>
    <p style="font-size:13px; color:var(--ink-soft); line-height:1.5;">
      • ผู้สมัครทั่วไป: กรอกแค่อีเมล<br>
      • Admin / Auditor01-05: กรอกอีเมลและรหัสผ่าน
    </p>
    
    <div class="field" style="text-align:left; margin-top:15px;">
      <label>อีเมลของคุณ</label>
      <input type="email" id="loginEmail" placeholder="example@email.com" required>
    </div>
    
    <div class="field" style="text-align:left;">
      <label>รหัสผ่าน <span style="font-size:11px; color:#888;">(เว้นว่างได้สำหรับผู้สมัครทั่วไป)</span></label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    
    <button class="primary" style="width:100%; margin-top:10px;" onclick="performLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<div class="wrap">
  <!-- USER STATUS BAR -->
  <div class="user-bar" id="userBar" style="display:none;">
    <div>
      👤 อีเมล: <strong id="currentUserEmail">-</strong> | 
      สิทธิ์: <span class="role-badge" id="currentUserRole">-</span>
    </div>
    <button onclick="logout()" style="background:none; border:1px solid #ccc; border-radius:4px; padding:4px 10px; cursor:pointer;">ออกจากระบบ</button>
  </div>

  <header class="top">
    <p style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--forest); margin:0;">ระบบรับสมัครงาน</p>
    <h1 style="font-family:'Fraunces',serif; margin:5px 0;">แฟ้มใบสมัครงาน</h1>
  </header>

  <nav class="tabs">
    <button id="tabApplyBtn" class="active">ยื่นใบสมัคร</button>
    <button id="tabViewBtn">รายการใบสมัครในระบบ</button>
  </nav>

  <!-- APPLY PANEL -->
  <section class="panel" id="applyPanel">
    <form id="appForm">
      <div class="section-label">ข้อมูลส่วนตัว</div>
      <div class="grid2">
        <div class="field"><label>ชื่อ-นามสกุล*</label><input type="text" id="fName" required></div>
        <div class="field"><label>วันเกิด</label><input type="date" id="fDob"></div>
        <div class="field"><label>เบอร์โทรศัพท์*</label><input type="tel" id="fPhone" required></div>
        <div class="field"><label>อีเมล*</label><input type="email" id="fEmail" required readonly style="background:#eee;"></div>
      </div>

      <div class="section-label">ข้อมูลการสมัคร</div>
      <div class="grid2">
        <div class="field"><label>ตำแหน่งที่สมัคร*</label><input type="text" id="fPosition" required></div>
        <div class="field"><label>เงินเดือนที่คาดหวัง</label><input type="text" id="fSalary"></div>
        <div class="field">
          <label>วุฒิการศึกษาสูงสุด</label>
          <select id="fEducation">
            <option value="">— เลือกวุฒิการศึกษา —</option>
            <option>ปริญญาตรี</option><option>ปริญญาโท</option><option>ปริญญาเอก</option><option>อื่นๆ</option>
          </select>
        </div>
      </div>
      
      <div class="field"><label>ประสบการณ์ทำงาน</label><textarea id="fExperience"></textarea></div>

      <div style="margin-top:1.5rem;">
        <button type="submit" class="primary" id="submitBtn">ส่งใบสมัคร</button>
      </div>
    </form>
  </section>

  <!-- VIEW PANEL -->
  <section class="panel" id="viewPanel" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <input type="text" id="searchInput" onkeyup="searchCards()" placeholder="ค้นหาชื่อ หรือตำแหน่ง..." style="padding:8px; width:250px;">
      <span id="recordCount" style="color:#888;">0 ใบสมัคร</span>
    </div>
    <div id="cardList" style="display:flex; flex-direction:column; gap:12px;"></div>
  </section>
</div>

<!-- MODAL DETAILS -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-content">
    <button class="modal-close" onclick="$('detailModal').classList.remove('active')">✕</button>
    <h2 id="modalName" style="margin-top:0; color:var(--forest);"></h2>
    
    <div class="grid2" style="margin-top:15px;">
      <div><strong>เลขที่ใบสมัคร:</strong> <span id="mdReceipt"></span></div>
      <div><strong>ตำแหน่งที่สมัคร:</strong> <span id="mdPosition"></span></div>
      <div><strong>เบอร์โทรศัพท์:</strong> <span id="mdPhone"></span></div>
      <div><strong>อีเมล:</strong> <span id="mdEmail"></span></div>
      <div><strong>สถานะปัจจุบัน:</strong> <span id="mdStatus"></span></div>
    </div>

    <!-- แผงปรับเปลี่ยนสถานะ (แสดงสำหรับ Admin และ Auditor01 - Auditor05) -->
    <div id="statusControlPanel" style="margin-top:20px; padding:15px; background:#f0f7f4; border-radius:8px; display:none;">
      <label style="font-size:13px; font-weight:bold; color:var(--forest);">อัปเดตสถานะผู้สมัคร (Admin & Auditor):</label>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <select id="changeStatusSelect" style="flex:1;">
          <option>ยื่นใบสมัครแล้ว</option>
          <option>กำลังตรวจสอบเอกสาร</option>
          <option>รอเรียกสัมภาษณ์</option>
          <option>ผ่านการคัดเลือก</option>
          <option>ไม่ผ่านการคัดเลือก</option>
        </select>
        <button onclick="saveNewStatus()" class="primary" style="padding:6px 16px;">บันทึกสถานะ</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const GOOGLE_SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwsjAXh2GmZ9Dda8-f5Qy-WfhkF4EZ9nC0eBfq5ZGXzWDgV8y3E-eKUhohKgA-k6txx/exec';

let currentUser = null; 
let currentSheetData = [];
let activeReceiptNo = null;

// ==========================================
// 1. ล็อกอิน & เช็คสิทธิ์
// ==========================================
window.addEventListener('DOMContentLoaded', () => {
  const savedEmail = sessionStorage.getItem('user_email');
  const savedPassword = sessionStorage.getItem('user_password') || '';
  if (savedEmail) {
    loginWithEmail(savedEmail, savedPassword);
  } else {
    $('loginOverlay').style.display = 'flex';
  }
});

function performLogin() {
  const email = $('loginEmail').value.trim();
  const password = $('loginPassword').value.trim();
  if (!email || !email.includes('@')) {
    alert('กรุณากรอกอีเมลให้ถูกต้อง');
    return;
  }
  loginWithEmail(email, password);
}

async function loginWithEmail(email, password = '') {
  try {
    const res = await fetch(`${GOOGLE_SHEET_ENDPOINT}?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`);
    const result = await res.json();

    if (result.status === 'error') {
      alert(result.message);
      $('loginOverlay').style.display = 'flex';
      return;
    }

    currentUser = {
      email: email,
      password: password,
      role: result.role || 'Staff'
    };

    sessionStorage.setItem('user_email', email);
    sessionStorage.setItem('user_password', password);
    
    $('loginOverlay').style.display = 'none';
    
    // อัปเดต UI แถบแสดงสถานะ
    $('userBar').style.display = 'flex';
    $('currentUserEmail').innerText = currentUser.email;
    $('currentUserRole').innerText = currentUser.role;
    
    // ตั้งคลาสสี Badge ตามบทบาท
    let badgeClass = 'role-Staff';
    if (currentUser.role === 'Admin') badgeClass = 'role-Admin';
    else if (currentUser.role.startsWith('Auditor')) badgeClass = 'role-Auditor';
    $('currentUserRole').className = `role-badge ${badgeClass}`;
    
    $('fEmail').value = currentUser.email;
    currentSheetData = result.data || [];
    renderCards();
  } catch (err) {
    alert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ');
  }
}

function logout() {
  sessionStorage.clear();
  location.reload();
}

// ==========================================
// 2. แสดงรายการใบสมัคร
// ==========================================
function renderCards(searchTerm = '') {
  const container = $('cardList');
  let data = [...currentSheetData];

  if (searchTerm) {
    const term = searchTerm.toLowerCase();
    data = data.filter(item => 
      (item['ชื่อ-นามสกุล'] && String(item['ชื่อ-นามสกุล']).toLowerCase().includes(term)) ||
      (item['ตำแหน่งที่สมัคร'] && String(item['ตำแหน่งที่สมัคร']).toLowerCase().includes(term))
    );
  }

  container.innerHTML = '';
  $('recordCount').innerText = `${data.length} ใบสมัคร`;

  if (data.length === 0) {
    container.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">ไม่พบรายการใบสมัคร</div>';
    return;
  }

  data.forEach(item => {
    const receiptNo = item['เลขที่ใบสมัคร'] || '-';
    const status = item['สถานะ'] || 'ยื่นใบสมัครแล้ว';
    const card = document.createElement('div');
    card.style.cssText = `background:#f2ecd9; border:1px solid #e0d8c3; border-radius:8px; padding:15px; display:flex; justify-content:space-between; align-items:center;`;

    // ปุ่มลบ: แสดงเฉพาะ Admin เท่านั้น
    const deleteBtnHTML = (currentUser.role === 'Admin') 
      ? `<button onclick="deleteRecord('${receiptNo}')" style="background:#d9534f; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px; margin-left:5px;">ลบ</button>` 
      : '';

    card.innerHTML = `
      <div>
        <h3 style="margin:0; cursor:pointer; color:#1a252f;" onclick="viewDetailsByReceipt('${receiptNo}')">${item['ชื่อ-นามสกุล'] || 'ไม่ระบุชื่อ'}</h3>
        <p style="margin:4px 0 0; font-size:13px; color:#555;">${item['ตำแหน่งที่สมัคร']} | สถานะ: <span class="status-badge">${status}</span></p>
      </div>
      <div style="text-align:right;">
        <div style="color:#cda12f; font-weight:bold; font-size:12px;">${receiptNo}</div>
        <div style="margin-top:6px;">
          <button onclick="viewDetailsByReceipt('${receiptNo}')" style="background:#2980b9; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">ดูข้อมูล</button>
          ${deleteBtnHTML}
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function searchCards() {
  renderCards($('searchInput').value);
}

// ==========================================
// 3. ดูรายละเอียด + อัปเดตสถานะ (Admin & Auditor)
// ==========================================
function viewDetailsByReceipt(receiptNo) {
  const item = currentSheetData.find(d => String(d['เลขที่ใบสมัคร']).trim() === String(receiptNo).trim());
  if (!item) return;

  activeReceiptNo = receiptNo;
  $('modalName').innerText = item['ชื่อ-นามสกุล'] || '-';
  $('mdReceipt').innerText = item['เลขที่ใบสมัคร'] || '-';
  $('mdPosition').innerText = item['ตำแหน่งที่สมัคร'] || '-';
  $('mdPhone').innerText = item['เบอร์โทรศัพท์'] || '-';
  $('mdEmail').innerText = item['อีเมล'] || '-';
  $('mdStatus').innerText = item['สถานะ'] || 'ยื่นใบสมัครแล้ว';

  // เปิดให้ Admin และ Auditor01 - Auditor05 สามารถเปลี่ยนสถานะได้
  if (currentUser.role === 'Admin' || currentUser.role.startsWith('Auditor')) {
    $('statusControlPanel').style.display = 'block';
    $('changeStatusSelect').value = item['สถานะ'] || 'ยื่นใบสมัครแล้ว';
  } else {
    $('statusControlPanel').style.display = 'none';
  }

  $('detailModal').classList.add('active');
}

async function saveNewStatus() {
  const newStatus = $('changeStatusSelect').value;
  try {
    const res = await fetch(GOOGLE_SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ 
        action: 'updateStatus', 
        receiptNo: activeReceiptNo, 
        status: newStatus,
        role: currentUser.role 
      })
    });
    alert('อัปเดตสถานะเรียบร้อยแล้ว');
    $('detailModal').classList.remove('active');
    loginWithEmail(currentUser.email, currentUser.password); // โหลดข้อมูลใหม่
  } catch(err) {
    alert('เกิดข้อผิดพลาดในการอัปเดตสถานะ');
  }
}

// ==========================================
// 4. สลับ Tab & ยื่นใบสมัคร
// ==========================================
$('tabApplyBtn').onclick = () => switchTab('apply');
$('tabViewBtn').onclick = () => switchTab('view');

function switchTab(name) {
  const isApply = name === 'apply';
  $('tabApplyBtn').classList.toggle('active', isApply);
  $('tabViewBtn').classList.toggle('active', !isApply);
  $('applyPanel').style.display = isApply ? 'block' : 'none';
  $('viewPanel').style.display = isApply ? 'none' : 'block';
}

$('appForm').onsubmit = async (e) => {
  e.preventDefault();
  $('submitBtn').disabled = true;

  const now = new Date();
  const receiptNo = 'APP-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + Math.random().toString(36).slice(2,6).toUpperCase();

  const record = {
    action: 'create',
    receiptNo: receiptNo,
    name: $('fName').value.trim(),
    phone: $('fPhone').value.trim(),
    email: currentUser.email,
    dob: $('fDob').value,
    address: $('fAddress').value.trim(),
    position: $('fPosition').value.trim(),
    salary: $('fSalary').value.trim(),
    education: $('fEducation').value,
    experience: $('fExperience').value.trim()
  };

  try {
    await fetch(GOOGLE_SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(record)
    });

    alert('ยื่นใบสมัครสำเร็จ! เลขที่ใบสมัครของคุณคือ: ' + receiptNo);
    $('appForm').reset();
    $('fEmail').value = currentUser.email;
    loginWithEmail(currentUser.email, currentUser.password);
    switchTab('view');
  } catch(err) {
    alert('เกิดข้อผิดพลาดในการส่งใบสมัคร');
  }
  $('submitBtn').disabled = false;
};

// ==========================================
// 5. ลบใบสมัคร (เฉพาะ Admin)
// ==========================================
async function deleteRecord(receiptNo) {
  if (!confirm('ยืนยันการลบใบสมัครนี้? (เฉพาะ Admin เท่านั้นที่ทำได้)')) return;
  try {
    await fetch(GOOGLE_SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ 
        action: 'delete', 
        receiptNo: receiptNo,
        role: currentUser.role 
      })
    });
    alert('ลบรายการเรียบร้อย');
    loginWithEmail(currentUser.email, currentUser.password);
  } catch(err) {
    alert('เกิดข้อผิดพลาดในการลบ');
  }
}
</script>
</body>
</html>
